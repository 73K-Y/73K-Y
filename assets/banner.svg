<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Tommy Hodoroaba - 3D Artist and Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030612"/>
      <stop offset="1" stop-color="#0b1633"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fa6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7fa6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7fa6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- binari stilizzati che si aprono a ventaglio, a destra -->
  <g fill="none" stroke="#7fa6ff" stroke-opacity="0.16" stroke-width="2">
    <path d="M760 320 C 900 230, 1040 200, 1280 190"/>
    <path d="M790 320 C 930 240, 1060 222, 1280 214"/>
    <path d="M840 320 C 960 260, 1080 246, 1280 240"/>
    <path d="M870 320 C 990 272, 1100 266, 1280 264"/>
    <path d="M930 320 C 1030 292, 1130 288, 1280 288"/>
    <path d="M960 320 C 1060 302, 1150 300, 1280 300"/>
  </g>
  <!-- pali della linea aerea -->
  <g stroke="#7fa6ff" stroke-opacity="0.22" stroke-width="3">
    <line x1="1010" y1="120" x2="1010" y2="250"/>
    <line x1="1150" y1="105" x2="1150" y2="235"/>
    <line x1="1010" y1="132" x2="1060" y2="132"/>
    <line x1="1150" y1="117" x2="1200" y2="117"/>
  </g>
  <path d="M880 150 Q 1080 162 1280 128" fill="none" stroke="url(#fade)" stroke-width="2"/>

  <!-- tricolore -->
  <rect x="72" y="92" width="18" height="4" fill="#009246"/>
  <rect x="90" y="92" width="18" height="4" fill="#f1f2f1"/>
  <rect x="108" y="92" width="18" height="4" fill="#ce2b37"/>

  <text x="72" y="160" fill="#f1f3f8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="700">Tommy Hodoroaba</text>
  <text x="72" y="204" fill="#9fb2d9" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24">3D Artist &amp; Developer  ·  Turin, Italy</text>
  <text x="72" y="248" fill="#6f83ad" font-family="Consolas, Menlo, monospace" font-size="18">Blender · Roblox Studio (Luau) · Unreal Engine 5 · Python</text>
</svg>
